packages:
  - packages/activity
  - packages/ai-sdk
  - packages/client
  - packages/cloud
  - packages/common
  - packages/core-bridge
  - packages/create-project
  - packages/envconfig
  - packages/interceptors-opentelemetry
  - packages/meta
  - packages/nexus
  - packages/nyc-test-coverage
  - packages/openai-agents
  - packages/plugin
  - packages/proto
  - packages/test
  - packages/testing
  - packages/worker
  - packages/workflow
  - scripts
  # OpenAI Agents samples
  - ../temporal-samples-typescript/openai-agents
  # OpenAI Agents JS packages (for development)
  - ../openai-agents-js/packages/agents
  - ../openai-agents-js/packages/agents-core
  - ../openai-agents-js/packages/agents-openai
  - ../openai-agents-js/packages/agents-realtime
  - ../openai-agents-js/packages/agents-extensions

ignoreScripts: true

minimumReleaseAge: 1440

# Allow depending on just published Temporal packages
minimumReleaseAgeExclude:
  - '@temporalio/*'
  - nexus-rpc
  # TODO: remove once this ages past min release age
  - '@modelcontextprotocol/sdk@1.25.2'

peerDependencyRules:
  ignoreMissing:
    # Peer of json-joy@9.9.1, missing in memfs@4.6.0
    # No apparent issue at runtime if not present
    - quill-delta

overrides:
  # Can be removed once a release of `express` with an updated qs is cut
  'qs': '^6.14.1'
  # Force workspace versions for OpenAI packages
  '@openai/agents': 'workspace:*'
  '@openai/agents-core': 'workspace:*'
  '@openai/agents-openai': 'workspace:*'
